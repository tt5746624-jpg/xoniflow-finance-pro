name: Build Android APK & iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK
        run: |
          gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XoniFlow-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Android Release APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: XoniFlow-Android-Release-Bundle
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS (Xcode App & Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Shared UI Engine to iOS Bundle
        run: |
          mkdir -p ios/XoniFlow/XoniFlow/www
          cp -r app/src/main/assets/www/* ios/XoniFlow/XoniFlow/www/

      - name: Build iOS Simulator App
        run: |
          xcodebuild -project ios/XoniFlow/XoniFlow.xcodeproj \
            -scheme XoniFlow \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned iOS IPA (For AltStore / Sideloadly / TrollStore)
        run: |
          xcodebuild -project ios/XoniFlow/XoniFlow.xcodeproj \
            -scheme XoniFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build_device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p ios/Payload
          cp -r ios/build_device/Build/Products/Release-iphoneos/XoniFlow.app ios/Payload/
          cd ios && zip -r XoniFlow-iOS-Unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA & Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: XoniFlow-iOS-IPA
          path: |
            ios/XoniFlow-iOS-Unsigned.ipa
